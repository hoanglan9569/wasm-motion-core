[package]
name = "motion-core"
version = "0.1.0"
edition = "2021"
description = "Tween, scroll, tilt and particle maths for web pages, compiled to a tiny WebAssembly module"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
